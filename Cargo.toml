[package]
name = "tokenbar"
version = "0.2.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dirs = "6"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
wry = "0.55"
tao = "0.35"
cookie = "0.18"
base64 = "0.22"
urlencoding = "2"
axum = { version = "0.8", features = ["json", "tokio"] }
tower-http = { version = "0.6", features = ["set-header"] }
