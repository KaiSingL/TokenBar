<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0c0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="/favicon.png" type="image/png" sizes="180x180" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>TokenBar</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0d10;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --dim: #5f6368;
      --card: #16181d;
      --border: #2a2e37;
      --accent: #8ab4f8;
      --ok: #81c995;
      --warn: #fdd663;
      --bad: #f28b82;
      --bar-track: #2a2e37;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      -webkit-tap-highlight-color: transparent;
    }
    .wrap {
      max-width: 36rem;
      margin: 0 auto;
      padding: calc(1rem + var(--safe-top)) 1rem calc(1.5rem + var(--safe-bottom));
    }
    header.app {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.1rem;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.28rem;
    }
    .brand-icon {
      width: 2.35rem;
      height: 2.35rem;
      flex-shrink: 0;
      display: block;
    }
    .meta {
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .header-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ok);
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 999px;
      padding: 0.35rem 0.7rem;
      white-space: nowrap;
    }
    .live.sync { color: var(--accent); }
    .live.idle { color: var(--dim); }
    .live::before {
      content: "";
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 25%, transparent);
    }
    .cards {
      display: grid;
      /* minmax(0, 1fr), not an implicit auto track: an auto track sizes to the
         widest max-content child, so one long nowrap label (a masked credential
         like "hermes:opencode-ckibashi · sk-…") widened the whole page past the
         viewport. min-width:0 below lets the cards shrink and ellipsize instead. */
      grid-template-columns: minmax(0, 1fr);
      gap: 0.75rem;
    }
    .card {
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.9rem 1rem 1rem;
    }
    .card.error { border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); }
    .card.stale { border-color: color-mix(in srgb, var(--warn) 40%, var(--border)); }
    .card.no_session { opacity: 0.78; }
    .card.not_subscribed {
      opacity: 0.85;
      border-color: color-mix(in srgb, var(--accent) 25%, var(--border));
    }
    .card-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .card-title {
      font-weight: 650;
      font-size: 1rem;
      letter-spacing: -0.01em;
    }
    .provider {
      color: var(--dim);
      font-weight: 500;
      font-size: 0.85rem;
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 650;
      text-transform: lowercase;
      letter-spacing: 0.02em;
      color: var(--ok);
    }
    .badge.loading { color: var(--accent); }
    .badge.stale { color: var(--warn); }
    .badge.error { color: var(--bad); }
    .badge.no_session { color: var(--dim); }
    .badge.not_subscribed { color: var(--accent); }
    .meter { margin-top: 0.65rem; }
    .meter:first-of-type { margin-top: 0; }
    .meter[data-hidden] {
      max-height: 0;
      margin-top: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.25s ease, margin-top 0.3s ease;
    }
    .card.expanded .meter[data-hidden] {
      max-height: 5rem;
      margin-top: 0.65rem;
      opacity: 1;
    }
    .card-top-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }
    .chevron-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.1rem;
      height: 1.1rem;
      color: var(--dim);
      cursor: pointer;
      transition: transform 0.2s ease, color 0.15s;
    }
    .chevron-btn:hover { color: var(--muted); }
    .chevron-btn svg { width: 14px; height: 14px; }
    .chevron-btn.expanded svg { transform: rotate(90deg); }
    .meter-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.3rem;
    }
    .meter-label { color: var(--muted); font-size: 0.82rem; min-width: 3.5rem; }
    .meter-pct {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .meter-pct.ok { color: var(--ok); }
    .meter-pct.warn { color: var(--warn); }
    .meter-pct.bad { color: var(--bad); }
    .bar {
      height: 0.55rem;
      border-radius: 999px;
      background: var(--bar-track);
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--ok);
      transition: width 0.35s ease;
    }
    .bar > i.warn { background: var(--warn); }
    .bar > i.bad { background: var(--bad); }
    .reset {
      margin-top: 0.28rem;
      color: var(--dim);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }
    .note {
      margin-top: 0.7rem;
      color: var(--warn);
      font-size: 0.78rem;
      word-break: break-word;
    }
    .note.bad { color: var(--bad); }
    .note.dim { color: var(--dim); }
    .cred-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding-top: 0.7rem;
      border-top: 1px solid var(--border);
    }
    .cred-kind {
      flex-shrink: 0;
      font-size: 0.7rem;
      font-weight: 650;
      color: var(--accent);
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 999px;
      padding: 0.22rem 0.55rem;
      white-space: nowrap;
    }
    .cred-kind.none { color: var(--dim); }
    .cred-mask {
      flex: 1;
      min-width: 0;
      color: var(--dim);
      font-size: 0.78rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cred-btn, .cred-eye, .cred-cancel {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      min-width: 44px;
      padding: 0 0.85rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--muted);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .cred-btn { color: var(--accent); }
    .cred-hint {
      color: var(--dim);
      font-size: 0.76rem;
      line-height: 1.35;
    }
    .cred-form {
      display: grid;
      min-width: 0;
      gap: 0.6rem;
      margin-top: 0.6rem;
    }
    .src-section {
      margin-top: 0.7rem;
      padding-top: 0.65rem;
      border-top: 1px dashed var(--border);
      display: grid;
      gap: 0.45rem;
    }
    .src-hint {
      color: var(--dim);
      font-size: 0.76rem;
      line-height: 1.35;
    }
    .src-list { display: grid; min-width: 0; gap: 0.4rem; }
    .src-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: 0.45rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      font-size: 0.85rem;
      text-align: left;
      cursor: pointer;
    }
    .src-row:not(:disabled):active { transform: scale(0.98); }
    .src-row:disabled { opacity: 0.5; cursor: default; }
    .src-ref {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      color: var(--accent);
    }
    .src-note {
      flex-shrink: 0;
      max-width: 55%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--dim);
      font-size: 0.74rem;
    }
    .cred-input-row { display: flex; gap: 0.5rem; }
    .cred-input {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      padding: 0 0.7rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--fg);
      font-family: inherit;
      font-size: 16px; /* ≥16px so iOS does not auto-zoom on focus */
    }
    .cred-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .cred-actions { display: flex; gap: 0.4rem; }
    .cred-save {
      flex: 1;
      min-height: 44px;
      border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
      border-radius: 10px;
      background: color-mix(in srgb, var(--accent) 14%, var(--bg));
      color: var(--accent);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 650;
      cursor: pointer;
    }
    .cred-btn:active, .cred-eye:active, .cred-save:active, .cred-cancel:active {
      transform: scale(0.97);
    }
    .cred-btn:disabled, .cred-eye:disabled, .cred-save:disabled, .cred-cancel:disabled,
    .cred-input:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .empty, .err-page {
      text-align: center;
      color: var(--muted);
      padding: 2.5rem 1rem;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }
    @media (min-width: 480px) {
      .wrap { padding-top: calc(1.5rem + var(--safe-top)); }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app">
      <div>
        <div class="brand">
          <img class="brand-icon" src="/icon.svg" width="38" height="38" alt="" />
          <h1>TokenBar</h1>
        </div>
        <div class="meta" id="meta">Loading…</div>
      </div>
      <div class="header-actions">
        <div class="live idle" id="live">idle</div>
      </div>
    </header>
    <div class="cards" id="cards">
      <div class="empty">Fetching usage…</div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
